version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password
      POSTGRES_DB: hotel_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_URL=postgres://hotel_user:hotel_password@db:5432/hotel_db?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "migrate -path /app/db/migrations -database $$DB_URL up && ./main"

volumes:
  postgres_data:
